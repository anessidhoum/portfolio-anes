<text x="1195.5" y="420" fill="#d7d9e2" font-family="Arial" font-size="21">Real-life humor vs. designed visuals</text><text x="90" y="535" fill="#7c9cff" font-family="Arial" font-size="24" font-weight="bold" letter-spacing="2">WHAT THE DATA SHOWED</text><circle cx="97" cy="582" r="5" fill="#7c9cff"/><text x="118" y="590" fill="#f0f1f5" font-family="Arial" font-size="23">Paid activity drove 90% of Instagram views</text><circle cx="97" cy="636" r="5" fill="#7c9cff"/><text x="118" y="644" fill="#f0f1f5" font-family="Arial" font-size="23">Real-life humor led performance across platforms</text><circle cx="97" cy="690" r="5" fill="#7c9cff"/><text x="118" y="698" fill="#f0f1f5" font-family="Arial" font-size="23">Audience conversation remained a key weakness</text><text x="822" y="535" fill="#7c9cff" font-family="Arial" font-size="24" font-weight="bold" letter-spacing="2">WHAT TO CHANGE NEXT</text><circle cx="829" cy="582" r="5" fill="#7c9cff"/><text x="850" y="590" fill="#f0f1f5" font-family="Arial" font-size="23">Scale recurring POV and real-life humor videos</text><circle cx="829" cy="636" r="5" fill="#7c9cff"/><text x="850" y="644" fill="#f0f1f5" font-family="Arial" font-size="23">Test creator LIVE and a private Telegram channel</text><circle cx="829" cy="690" r="5" fill="#7c9cff"/><text x="850" y="698" fill="#f0f1f5" font-family="Arial" font-size="23">Track links through to AVENTY ERP sign-ups</text><line x1="90" y1="810" x2="1510" y2="810" stroke="#fff" opacity=".16"/>
<text x="90" y="850" fill="#aeb3c5" font-family="Arial" font-size="18">Source: AVENTY October 2026 Social Media Performance Report. November figures are targets, not achieved results.</text>
